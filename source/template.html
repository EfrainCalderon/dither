<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dither</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /*__FONTS__*/
  :root {
    --ink: #eef5f3;
    --ink-dim: rgba(238, 245, 243, 0.68);
    --line: rgba(238, 245, 243, 0.22);
    --chip: rgba(8, 14, 22, 0.42);
    --glow: #ffffff;
    --accent: #9fe3d8;
    --shadow: none;
    --ui: 1;              /* the bottom controls scale with the window (set in code, never below ~0.78) */
    /* type scale (pixel type reads small, so nothing goes below --t-sm). Steps grow by about 1.25×. */
    --t-sm: 20px;         /* the smallest text anywhere: credits, tooltips */
    --t-md: 24px;         /* buttons */
    --t-lg: 30px;         /* about card lines */
    --t-xl: 72px;         /* about card title */
    /* solid buttons: fill + words, set in code from the sky so the fill always stands out (see solidButton) */
    --btn-bg: #0f2a3d; --btn-ink: #f2f8f6; --abtn-bg: #0f2a3d; --abtn-ink: #f2f8f6; --cbtn-bg: #0f2a3d; --cbtn-ink: #f2f8f6;
    --abtn-tone: #3a5468;   /* a quieter, opaque shade for secondary controls near the timer (pause, the tab track); its words use --abtn-bg */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0f18; overflow: hidden; touch-action: none; }   /* pinches belong to the tank, not the page */
  .drawer { touch-action: pan-y; }
  body { font: 17px/1.2 Pixel, ui-monospace, Menlo, Consolas, monospace; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: default; }
  #c.edge-l { cursor: w-resize; } #c.edge-r { cursor: e-resize; } #c.water, #c.base { cursor: pointer; } #c.grab { cursor: grab; }
  body.dragging, body.dragging #c { cursor: grabbing !important; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- halftone: real text and icons, painted with a dot pattern */
  .ht-text { color: transparent; background-image: radial-gradient(circle, var(--ink) 1.05px, transparent 1.35px); background-size: 2.5px 2.5px;
             -webkit-background-clip: text; background-clip: text; font-weight: 400; }
  .ht-icon { display: block; width: var(--s); height: var(--s); background-image: radial-gradient(circle, var(--ink) 1.15px, transparent 1.5px); background-size: 2.6px 2.6px;
             -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; transition: transform 250ms ease; }
  .ht-halo { position: absolute; left: 50%; top: 50%; width: calc(var(--s) * 1.5); height: calc(var(--s) * 1.5); transform: translate(-50%, -50%);
             background-image: radial-gradient(circle, var(--glow) 1.0px, transparent 1.4px); background-size: 2.6px 2.6px;
             -webkit-mask: var(--mb) center / contain no-repeat; mask: var(--mb) center / contain no-repeat; opacity: 0; transition: opacity 350ms ease; pointer-events: none; }
  .icon-btn { --s: calc(46px * var(--ui)); position: relative; width: calc(66px * var(--ui)); height: calc(66px * var(--ui)); padding: 0; border: 0; background: none; border-radius: 18px; display: grid; place-items: center; }
  .icon-btn:hover .ht-halo, .icon-btn:focus-visible .ht-halo { opacity: 1; }
  .icon-btn:focus-visible { outline: none; }
  .icon-btn .ht-icon { background: var(--ink); }      /* the corner icons are solid; their hover halo stays dotted */
  /* no backdrop behind the corners: the icons and slider carry a thin edge in the opposite colour, like the digits' outline */
  .dock .icon-btn, .vol .icon-btn, .vol input[type=range] { filter: drop-shadow(0 0 1px var(--halo)) drop-shadow(0 0 1px var(--halo)); }
  .tip { position: absolute; left: 50%; bottom: calc(100% - 2px); transform: translate(-50%, 6px); white-space: nowrap; font-size: max(var(--t-sm), calc(var(--t-sm) * var(--ui))); line-height: 1; padding: 4px 2px;
         opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease; }
  .icon-btn:hover .tip, .icon-btn:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
  .dock .icon-btn:first-child .tip { left: calc(33px * var(--ui)); }

  /* the timer is drawn in the scene; this invisible button sits on top of it */
  #timerHit { position: fixed; z-index: 3; background: transparent; border: 0; border-radius: 12px; padding: 0; }
  #timerHit:focus-visible { outline: none; }

  .dock { position: fixed; z-index: 4; left: calc(24px - 10px * var(--ui) + env(safe-area-inset-left)); bottom: calc(24px - 10px * var(--ui) + env(safe-area-inset-bottom)); display: flex; gap: calc(24px - 10px * var(--ui)); align-items: center; }
  .dithering { -webkit-mask-repeat: repeat; mask-repeat: repeat; }

  /* ---------- bottom right: music volume. The corners keep 24px from the edges to what you see (icons sit inset in their hit areas). */
  .rdock { position: fixed; z-index: 4; right: calc(22px + env(safe-area-inset-right)); bottom: calc(24px - 10px * var(--ui) + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px;
           height: calc(66px * var(--ui)); }      /* same height as the left dock, so both rows of buttons share a centerline */
  .dock { height: calc(66px * var(--ui)); }
  .vol { display: flex; align-items: center; gap: 2px; }
  .vol .icon-btn { --s: calc(30px * var(--ui)); width: calc(48px * var(--ui)); height: calc(48px * var(--ui)); }
  .vol input[type=range] { width: calc(92px * var(--ui)); accent-color: var(--ink); cursor: pointer; }
  body.swapping #rescapeBtn, body.swapping .undo { opacity: 0.45; pointer-events: none; transition: opacity 150ms; }
  @media (max-width: 640px) {     /* phones: just the speaker in the corner; the phone's own volume buttons set the level */
    .vol input[type=range] { display: none; }
    .vol .tip { display: none; }
    .vol .icon-btn { width: 48px; height: 48px; }
    .rdock { right: calc(15px * var(--ui) + env(safe-area-inset-right)); }
  }
  /* while a focus session runs, everything but the timer steps back after a few still seconds (body.quiet, set in code) */
  :is(.dock, .rdock, .mode-tabs, .timer-actions) { transition: opacity 600ms ease; }
  body.quiet :is(.dock, .rdock, .mode-tabs, .timer-actions) { opacity: 0.28; }

  /* ---------- touch screens: every control gets at least a 44pt target (Apple's minimum), without changing how it looks.
     An invisible layer extends each small button or link to 44px each way. */
  @media (pointer: coarse) {
    .vol .icon-btn::before, .title a::before, .mode-tabs button::before { content: ''; position: absolute; left: 50%; top: 50%; width: 44px; min-width: 100%; height: 44px; min-height: 100%; transform: translate(-50%, -50%); }
    .vol input[type=range] { min-height: 44px; }
    .credits a { padding: 6px 2px 23px; margin: 0 -2px; }      /* reach down into the card's empty bottom edge, not up into the coffee button */
  }

  /* ---------- 8-bit corners: buttons and tabs are boxes with a two-step pixel staircase at each corner (--p is one step) */
  .ghost::before, .ghost::after, .mode-tabs button, .coffee, .coffee .cup { --p: 4px; border-radius: 0;
    clip-path: polygon(0 calc(var(--p) * 2), var(--p) calc(var(--p) * 2), var(--p) var(--p), calc(var(--p) * 2) var(--p), calc(var(--p) * 2) 0,
      calc(100% - var(--p) * 2) 0, calc(100% - var(--p) * 2) var(--p), calc(100% - var(--p)) var(--p), calc(100% - var(--p)) calc(var(--p) * 2), 100% calc(var(--p) * 2),
      100% calc(100% - var(--p) * 2), calc(100% - var(--p)) calc(100% - var(--p) * 2), calc(100% - var(--p)) calc(100% - var(--p)), calc(100% - var(--p) * 2) calc(100% - var(--p)), calc(100% - var(--p) * 2) 100%,
      calc(var(--p) * 2) 100%, calc(var(--p) * 2) calc(100% - var(--p)), var(--p) calc(100% - var(--p)), var(--p) calc(100% - var(--p) * 2), 0 calc(100% - var(--p) * 2)); }
  .coffee .cup { --p: 7px; }
  /* ---------- buttons: solid fill, solid words and icon. The fill flips dark/light with the sky behind it (solidButton in code). */
  .ghost { --bg: var(--btn-bg); --fg: var(--btn-ink); --ink: var(--fg);
           position: relative; display: inline-flex; align-items: center; gap: calc(9px * var(--ui)); height: max(44px, calc(44px * var(--ui))); padding: 0 calc(20px * var(--ui)) 0 calc(15px * var(--ui));
           border: 0; background: none; color: var(--fg); isolation: isolate; transition: transform 150ms ease; --sh: var(--btn-tone); }
  /* the fill (::before) and, on hover, a hard 8-bit shadow under it (::after) in the sky's tone; the button lifts a touch */
  .ghost::before, .ghost::after { content: ''; position: absolute; inset: 0; pointer-events: none; }
  .ghost::before { z-index: -1; background: var(--bg); }
  .ghost::after { z-index: -2; background: var(--sh); opacity: 0; transition: transform 150ms ease, opacity 150ms ease; }
  .ghost:hover, .ghost:focus-visible { transform: translateY(-2px); }
  .ghost:hover::after, .ghost:focus-visible::after { opacity: 1; transform: translateY(5px); }
  .ghost:active { transform: translateY(1px); }
  .ghost:active::after { transform: translateY(1px); }
  .timer-actions .ghost { --bg: var(--abtn-bg); --fg: var(--abtn-ink); --sh: var(--abtn-tone); }
  .ghost .ht-text { color: var(--fg); background: none; -webkit-background-clip: border-box; background-clip: border-box; }
  :is(.ghost, .coffee) .ht-icon { background: var(--fg); }
  .ghost .ht-halo { display: none; }
  .ghost[hidden], .icon-btn[hidden] { display: none; }
  .ghost:focus-visible { outline: none; }
  .ghost:focus-visible::before { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--glow) 70%, transparent); }
  .ghost .ht-icon { --s: calc(24px * var(--ui)); }
  .ghost .ht-halo { --s: calc(24px * var(--ui)); left: calc(27px * var(--ui)); }
  .ghost:hover .ht-halo, .ghost:focus-visible .ht-halo { opacity: 1; }
  .ghost .ht-text { font-size: max(var(--t-sm), calc(var(--t-md) * var(--ui))); line-height: 1; }

  /* ---------- the timer's controls. Above the digits: the session tabs, plain words with the current one on a soft
     pill. The three are the same width, so the middle one sits right over the middle of the digits.
     Below: Start (the main action, solid and larger) or Pause (quieter), with skip as a bare icon beside it while a session runs. */
  .mode-tabs { position: fixed; z-index: 4; left: 50%; top: calc(24px + env(safe-area-inset-top)); transform: translateX(-50%);
               width: max-content; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  .mode-tabs[hidden] { display: none; }
  .mode-tabs button { position: relative; height: 40px; padding: 0 16px; border: 0; background: transparent; color: var(--abtn-bg);
                      text-shadow: 0 0 1px var(--abtn-ink), 0 0 2px var(--abtn-ink), 0 0 4px color-mix(in srgb, var(--abtn-ink) 60%, transparent);
                      font-size: max(var(--t-sm), calc(var(--t-sm) * var(--ui))); line-height: 1; white-space: nowrap; transition: background-color 200ms ease; }
  .mode-tabs button[aria-pressed=true] { background: var(--abtn-tone); text-shadow: none; }
  .mode-tabs button:not([aria-pressed=true]):hover { background: color-mix(in srgb, var(--abtn-tone) 45%, transparent); }
  .mode-tabs button:focus-visible { outline: 2px solid var(--abtn-bg); outline-offset: -4px; }
  .skip:focus-visible { outline: 2px solid var(--abtn-bg); outline-offset: 2px; }
  .timer-actions { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .timer-actions[hidden] { display: none; }
  .ta-row { position: relative; display: flex; }
  .timer-actions .ghost { --bg: var(--abtn-bg); --fg: var(--abtn-ink); }
  /* Start and Pause share one size (so the row never jumps); Start leads by its solid fill, Pause is tonal */
  .timer-actions .ghost .ht-text { font-size: max(var(--t-md), calc(var(--t-lg) * var(--ui))); }
  .ghost.primary { height: max(48px, calc(56px * var(--ui))); padding: 0 calc(28px * var(--ui)) 0 calc(22px * var(--ui)); gap: calc(12px * var(--ui)); }
  .ghost.primary .ht-icon { --s: calc(20px * var(--ui)); }
  .timer-actions .ghost.tonal { --bg: var(--abtn-tone); --fg: var(--abtn-bg); --sh: color-mix(in srgb, var(--abtn-tone) 55%, var(--abtn-bg)); height: max(48px, calc(56px * var(--ui))); padding: 0 calc(28px * var(--ui)); }
  .skip { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 6px; width: 44px; height: 44px; padding: 0; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; }
  .skip[hidden] { display: none; }
  .skip .ht-icon { --s: 24px; background: var(--abtn-bg); }
  .skip { filter: drop-shadow(0 0 1px var(--abtn-ink)) drop-shadow(0 0 1px var(--abtn-ink)); }
  .skip:hover .ht-icon { transform: translateX(2px); }

  /* ---------- undo: centered, level with the dock; fades away in 4 seconds */
  .undo-wrap { display: none; }      /* the undo button lives next to whatever it undoes */
  .undo[hidden] { display: none; }
  .undo { transition: opacity 280ms ease; }
  .undo.leaving { opacity: 0; }


  /* ---------- about: a black card whose edge glows in halftone dots; nothing blurred behind it */
  .about { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; background: transparent; visibility: hidden; pointer-events: none; }
  .about.on { visibility: visible; pointer-events: auto; }
  /* the card is see-through glass, so the controls step back while it's open instead of showing through it */
  .tune { transition: opacity 220ms ease; }
  body.about-open :is(.dock, .rdock, .timer-actions, .tune, .mode-tabs) { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 220ms ease, visibility 0s 220ms; }
  .glass { --ink: var(--card-ink, #143650); --line: color-mix(in srgb, var(--ink) 30%, transparent);
           position: relative; width: min(500px, calc(100vw - 32px)); padding: 46px 40px 38px; border-radius: 34px; display: grid; gap: 18px; justify-items: center; text-align: center;
           background: color-mix(in srgb, var(--card-bg, #8fbde6) 80%, transparent); transition: background-color 3s ease; }
  .glass .edge { position: absolute; left: -48px; top: -48px; width: calc(100% + 96px); height: calc(100% + 96px); pointer-events: none; z-index: -1; opacity: 0; transition: opacity 600ms ease 120ms; }
  .about.on .glass .edge { opacity: 1; transition: none; }
  .glass .close { position: absolute; right: 10px; top: 10px; --s: 22px; width: 44px; height: 44px; }
  .title { margin: 0; font-size: var(--t-lg); line-height: 1.2; font-weight: 400; white-space: nowrap; }
  @media (max-width: 420px) { .title { font-size: var(--t-md); } .glass { padding-left: 24px; padding-right: 24px; } }
  .title a { position: relative; text-decoration: none; }
  .title > span { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }   /* 5 taps here turns on admin, so no text selection */
  .title a::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 2px; border-radius: 1px; background: var(--ink); opacity: 0.85; transition: opacity 200ms, transform 200ms; }
  .title a:hover::after { opacity: 1; transform: scaleY(1.5); }
  /* "Buy me a coffee": the words, then a round cup button (it opens Buy Me a Coffee's own panel; see loadCoffee in code) */
  .coffee { --bg: var(--cbtn-bg); --fg: var(--cbtn-ink); position: relative; display: inline-flex; align-items: center; gap: 14px; padding: 4px 4px 4px 18px;
            text-decoration: none; font-size: var(--t-lg); line-height: 1; transition: background-color 220ms ease; }
  .coffee .cup { width: 52px; height: 52px; background: var(--bg); display: grid; place-items: center; transition: transform 220ms ease; }
  .coffee .ht-icon { --s: 30px; }
  .coffee:hover, .coffee:focus-visible { background: color-mix(in srgb, var(--ink) 9%, transparent); }
  .coffee:hover .cup, .coffee:focus-visible .cup { transform: scale(1.06); }
  .coffee:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .coffee:hover .ht-icon, .coffee:focus-visible .ht-icon { animation: steam 900ms ease-in-out infinite alternate; }
  @keyframes steam { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-2px) rotate(4deg); } }
  .credits { margin: 4px 0 0; font-size: var(--t-sm); line-height: 1.3; font-weight: 400; color: var(--ink); opacity: 0.85; }
  .credits a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .credits .nw { white-space: nowrap; }
  .credits a:hover { opacity: 1; }
  #bmc-wbtn { display: none !important; }
  @media (min-width: 480px) { #bmc-iframe { right: calc(50% - 210px) !important; bottom: 60px !important; transform-origin: 50% 60% !important; } }

  /* ---------- timer words as real type (prototype option) */
  .words { position: fixed; z-index: 2; pointer-events: none; display: none; color: var(--tink, #143650); text-align: center; }
  body.words-type .words { display: block; }
  .words .big { position: absolute; left: 0; right: 0; line-height: 1; }
  .words .lab { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 0.38em; line-height: 1; letter-spacing: 0.04em; }
  .words .play { width: 0.62em; height: 0.7em; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); flex: none; }
  .words .big, .words .lab { -webkit-text-stroke: 0.08em var(--toutline, #eef7f8); paint-order: stroke fill; }
  .words.glow { text-shadow: 0 0 10px var(--tglow, #fff), 0 0 2px var(--tglow, #fff); }
  .words.glow .play { filter: drop-shadow(0 0 5px var(--tglow, #fff)); }
  .words.dim { opacity: 0.6; }
  .words.geist { font-family: 'Geist Mono', ui-monospace, monospace; }
  .words.geist .lab { font-weight: 500; } .words.geist .big { font-weight: 700; letter-spacing: -0.02em; }
  .words.doto { font-family: 'Doto', ui-monospace, monospace; font-variation-settings: 'ROND' 100; }
  .words.doto .lab { font-weight: 900; } .words.doto .big { font-weight: 900; }

  /* ---------- prototype drawer (temporary): the admin panel keeps Inter */
  .tune, .drawer { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tune { position: fixed; z-index: 4; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12px; transition: opacity 700ms; }
  body:not(.admin) .tune, body:not(.admin) .drawer { display: none !important; }
  .tune:not(.tune-x) { right: 54px; }
  .tune-x { width: 30px; padding: 0; font-size: 16px; line-height: 1; }
  .tune-x:hover { background: rgba(255, 255, 255, 0.18); }
  .tune.on { background: rgba(159, 227, 216, 0.22); }
  .drawer { --ink: #eef5f3; --ink-dim: rgba(238,245,243,.68); --line: rgba(238,245,243,.22); color: var(--ink);
            position: fixed; z-index: 5; right: 16px; bottom: calc(116px + env(safe-area-inset-bottom)); width: 310px; padding: 14px; border-radius: 16px; display: none; gap: 13px;
            background: rgba(8, 14, 22, 0.66); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .drawer.on { display: grid; }
  .drawer h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
  .drawer button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-size: 12px; }
  .drawer button.on { background: rgba(159, 227, 216, 0.22); border-color: rgba(159, 227, 216, 0.6); }
  .field { display: grid; gap: 6px; }
  .field .top { display: flex; justify-content: space-between; align-items: baseline; color: var(--ink-dim); font-size: 12px; }
  .field .top b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .drawer .seg button { flex: 1; border: 0; border-radius: 0; background: transparent; }
  .seg button[aria-pressed="true"] { background: rgba(159, 227, 216, 0.22) !important; }
  select { flex: 1; min-width: 0; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: 12px; padding: 0 8px; }
  select option, select optgroup { background: #0d1620; color: #eef5f3; }
  .check { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .stats { position: fixed; right: 20px; top: 16px; font: 11px ui-monospace, Menlo, monospace; color: var(--ink-dim); display: none; text-align: right; }
  body.show-stats .stats { display: block; }
  @media (prefers-reduced-motion: reduce) { .about, .glass { transition: none; } .coffee:hover .ht-icon { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<button id="timerHit" aria-label="Start a 25 minute focus session"></button>

<div class="dock" role="toolbar" aria-label="Tank">
  <button class="icon-btn" id="aboutBtn" aria-label="About" aria-haspopup="dialog"><span class="ht-halo"></span><span class="ht-icon" data-icon="info"></span><span class="tip ht-text" aria-hidden="true">About</span></button>
  <button class="ghost" id="rescapeBtn"><span class="ht-halo"></span><span class="ht-icon" data-icon="refresh"></span><span class="ht-text">New tank</span></button>
</div>

<div class="mode-tabs" id="modeTabs" role="group" aria-label="Session" hidden>
  <button data-kind="focus" aria-pressed="true">Focus</button>
  <button data-kind="short" aria-pressed="false">Short rest</button>
  <button data-kind="long" aria-pressed="false">Long rest</button>
</div>
<div class="timer-actions" id="timerActions" hidden>
  <div class="ta-row">
    <button class="ghost primary" id="startBtn"><span class="ht-icon" data-icon="play"></span><span class="ht-text">Start</span></button>
    <button class="ghost tonal" id="pauseBtn" hidden><span class="ht-text">Pause</span></button>
    <button class="skip" id="skipBtn" aria-label="Skip to the next session" hidden><span class="ht-icon" data-icon="skip"></span></button>
  </div>
</div>
<div class="rdock" role="toolbar" aria-label="Music">
  <div class="vol">
    <button class="icon-btn" id="playBtn" aria-label="Play music" hidden><span class="ht-halo"></span><span class="ht-icon" data-icon="play"></span><span class="tip ht-text" aria-hidden="true">Play music</span></button>
    <button class="icon-btn" id="volBtn" aria-label="Mute music" aria-pressed="false"><span class="ht-halo"></span><span class="ht-icon" data-icon="vol"></span><span class="tip ht-text" aria-hidden="true">Mute</span></button>
    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.6" aria-label="Music volume">
  </div>
</div>
<div class="undo-wrap"><button class="ghost undo" id="undoPill" hidden><span class="ht-halo"></span><span class="ht-icon" data-icon="undo"></span><span class="ht-text">Undo</span></button></div>

<div class="about" id="about" role="dialog" aria-modal="true" aria-labelledby="appName">
  <div class="glass">
    <canvas class="edge" id="aboutEdge" aria-hidden="true"></canvas>
    <button class="icon-btn close" id="aboutClose" aria-label="Close"><span class="ht-halo"></span><span class="ht-icon" data-icon="close"></span></button>
    <h1 class="title" id="appName"><span class="ht-text">Dither by </span><a class="ht-text" href="https://www.efrain.design" target="_blank" rel="noopener">Efrain Calderon</a></h1>
    <a class="coffee" id="coffeeBtn" href="https://www.buymeacoffee.com/efrainfm" target="_blank" rel="noopener"><span class="ht-text">Buy me a coffee</span><span class="cup"><span class="ht-icon" data-icon="coffee"></span></span></a>
    <p class="credits">
      Music by <a href="https://pixabay.com/users/zephiramusic-54643547/?utm_source=link-attribution&amp;utm_medium=referral&amp;utm_campaign=music&amp;utm_content=589689" target="_blank" rel="noopener">Marek Zielinski</a> <span class="nw">from <a href="https://pixabay.com/music//?utm_source=link-attribution&amp;utm_medium=referral&amp;utm_campaign=music&amp;utm_content=589689" target="_blank" rel="noopener">Pixabay</a></span><br>
      Sound effect by <a href="https://pixabay.com/users/lesiakower-25701529/?utm_source=link-attribution&amp;utm_medium=referral&amp;utm_campaign=music&amp;utm_content=153002" target="_blank" rel="noopener">Lesiakower</a> <span class="nw">from <a href="https://pixabay.com//?utm_source=link-attribution&amp;utm_medium=referral&amp;utm_campaign=music&amp;utm_content=153002" target="_blank" rel="noopener">Pixabay</a></span>
    </p>
  </div>
</div>

<button class="tune" id="tune" aria-expanded="false" aria-controls="drawer">admin</button>
<button class="tune tune-x" id="adminX" aria-label="Exit admin mode" title="Exit admin mode">×</button>
<div class="drawer" id="drawer" role="region" aria-label="Admin controls">
  <h2>Admin · × to leave</h2>
  <div class="field">
    <div class="top"><label for="growth">Tank time</label><b id="growthVal">0 poms</b></div>
    <div class="row"><input id="growth" type="range" min="0" max="10" step="0.05" value="0"><button id="growthNow" class="on">now</button></div>
  </div>
  <div class="field">
    <div class="top"><label for="sky">Sky</label><b id="skyVal">—</b></div>
    <div class="row"><input id="sky" type="range" min="0" max="24" step="0.05" value="12"><button id="skyNow" class="on">now</button></div>
  </div>
  <div class="row"><button id="addPom">+1 pom</button><button id="endSoon">end timer in 3s</button><button id="resetTimer">reset</button></div>
  <div class="field">
    <div class="top"><span>Fish today</span><b id="fishVal">0</b></div>
    <div class="row"><button id="resetFish">reset fish to 0</button></div>
  </div>
  <div class="field">
    <div class="top"><label for="findSel">Found object</label><b id="findVal">none</b></div>
    <div class="row"><select id="findSel"></select><button id="findPlace">place</button></div>
  </div>
  <div class="field"><div class="top"><span>Timer words</span></div>
    <div class="seg" id="wordsSeg" role="group" aria-label="Timer words"></div></div>
  <div class="field"><div class="top"><span>Base light</span><b id="baseVal">auto</b></div>
    <div class="row"><button id="baseAuto">turn on / off</button></div></div>
  <div class="field"><div class="top"><span>Shape</span></div>
    <div class="seg" id="shapeSeg" role="group" aria-label="Tank shape"></div></div>
  <label class="check">Sound <input type="checkbox" id="sound"></label>
</div>

<div class="words" id="words" aria-hidden="true"><div class="big"></div><div class="lab"><span class="play"></span><span class="t"></span></div></div>
<div class="sr" id="live" aria-live="polite"></div>
<div class="stats" id="stats"></div>

<script>/*__APP__*/</script>
</body>
